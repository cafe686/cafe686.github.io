<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카페686 발주</title>
<meta name="apple-mobile-web-app-title" content="686 발주">
<style>
/* Layout: one phone column. Date on top, item rows grouped by section, note box, sticky save bar. */
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --ink:#1B211D; --sub:#5F6962; --line:#D9DED6;
  --accent:#24614A; --accent-ink:#FFFFFF; --accent-soft:#E0EEE6;
  --warn:#A2461C; --warn-soft:#F8E4D9;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131714; --card:#1C221E; --ink:#E7EBE6; --sub:#9AA59D; --line:#333B35;
  --accent:#7DBE9F; --accent-ink:#0E1F17; --accent-soft:#213A2E;
  --warn:#F09A72; --warn-soft:#3E2519; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --card:#1C221E; --ink:#E7EBE6; --sub:#9AA59D; --line:#333B35;
  --accent:#7DBE9F; --accent-ink:#0E1F17; --accent-soft:#213A2E;
  --warn:#F09A72; --warn-soft:#3E2519; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.hint{margin:4px 0 0;color:var(--sub);font-size:14px}
.datebox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.datebox label{color:var(--sub);font-size:14px;flex-shrink:0}
.datebox input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:700;padding:6px 0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec h2{margin:0;padding:12px 14px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.sec h2 span{font-weight:600;font-size:13px;color:var(--sub)}
.row{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h2 + .row{border-top:0}
.row.on{background:var(--accent-soft)}
.top{display:flex;align-items:center;gap:8px}
.nm{flex:1;min-width:0;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.tot{font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.mbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--sub);flex-shrink:0}
.chip{align-self:flex-start;font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:2px 8px}
.mbox{display:flex;gap:8px}
.mbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px}
.del{border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:8px;padding:0 10px;font-size:13px;flex-shrink:0}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st{display:flex;align-items:center;gap:6px}
.lb{font-size:13px;color:var(--sub);width:30px;flex-shrink:0}
.st button{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:22px;line-height:1;flex-shrink:0}
.st button:active{background:var(--accent-soft)}
.v{flex:1;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.vo.pos{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px}
.card textarea,.card input,.card select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:16px}
.card textarea{min-height:88px;resize:vertical}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{color:var(--warn);font-size:14px;margin:0}
.ok{color:var(--accent);font-size:15px;font-weight:600;margin:0}
#msg{min-height:300px;font-size:14px;line-height:1.5}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{font-size:13px;padding:8px 12px;color:var(--sub);font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar p{margin:0;font-size:14px;color:var(--sub);flex-shrink:0;font-variant-numeric:tabular-nums}
.bar p b{color:var(--ink);font-size:17px}
.bar button{flex:1;height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700}
.bar .undo{margin-bottom:8px}
.bar .undo p{flex:1;color:var(--ink)}
.bar .undo button{flex:0 0 auto;height:40px;padding:0 16px;font-size:15px;background:transparent;border:1px solid var(--accent);color:var(--accent)}
.plab{font-size:13px;color:var(--sub)}
.pct{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pct button{height:42px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:14px;padding:0}
.pct button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--card);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:16px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#vmsg,#mergeIn,#mergeOut{min-height:170px;font-size:14px;line-height:1.5}
.card .hint{margin:0}
.ulab{display:flex;align-items:center;gap:8px}
.usel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px}
.datebox select{flex:1;min-width:0;border:0;background:transparent;font-size:17px;font-weight:700;padding:6px 0}
.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.fold summary{padding:14px 0;font-size:15px;font-weight:600;color:var(--sub);cursor:pointer}
.fold[open]{padding-bottom:14px}
.fold .inner{display:flex;flex-direction:column;gap:18px}
.fold .card{border:0;border-radius:0;padding:0;background:transparent}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">양산점 파우더·청 발주</h1>
    <p class="hint">＋ － 로 숫자를 맞추고 저장을 누르세요.</p>
  </header>

  <div class="seg" role="group" aria-label="매장 고르기">
    <button type="button" id="st-ys" data-store="ys" aria-pressed="true">양산점</button>
    <button type="button" id="st-jg" data-store="jg" aria-pressed="false">정관점</button>
  </div>

  <div class="datebox">
    <label for="sheet">발주처</label>
    <select id="sheet" aria-label="발주처 고르기"></select>
  </div>

  <div class="datebox">
    <label for="who">발주자</label>
    <input id="who" placeholder="이름을 적어주세요" autocomplete="off" aria-label="발주자 이름">
  </div>
  <p class="err" id="whoErr" hidden>발주자 이름을 적어주세요.</p>

  <div class="datebox">
    <label for="date">발주 날짜</label>
    <input id="date" inputmode="text" autocomplete="off" aria-label="발주 날짜">
  </div>

  <main id="list"></main>

  <section class="card">
    <h2>기타사항</h2>
    <textarea id="etc" placeholder="예: 물티슈 1개 입고됨"></textarea>
  </section>

  <section class="card" id="out" hidden>
    <h2>여사장님께 보낼 발주품목</h2>
    <p class="ok" id="vstatus"></p>
    <textarea id="vmsg" readonly aria-label="여사장님께 보낼 발주품목"></textarea>
    <button class="btn primary" id="vcopyBtn" type="button">발주품목 복사</button>
    <h2>전체 체크 내용 (잔여 포함, 보관용)</h2>
    <textarea id="msg" readonly aria-label="잔여까지 적힌 전체 체크 내용"></textarea>
    <button class="btn" id="copyBtn" type="button">전체 체크 내용 복사</button>
    <p class="ok" id="status"></p>
  </section>

  <details class="fold">
  <summary>품목 관리 (추가 · 빼기 · 되돌리기)</summary>
  <div class="inner">
  <section class="card">
    <h2>품목 추가</h2>
    <div class="addrow">
      <input id="addName" placeholder="품목 이름" autocomplete="off" aria-label="추가할 품목 이름">
      <select id="addSec" aria-label="넣을 묶음"></select>
    </div>
    <p class="err" id="addErr" hidden></p>
    <button class="btn" id="addBtn" type="button">품목 추가</button>
  </section>

  <section class="card">
    <h2>품목 빼기</h2>
    <p class="hint">안 쓰는 품목만 골라서 빼세요. 빼고 나면 화면 아래에 되돌리기가 떠요.</p>
    <select id="delSel" aria-label="뺄 품목 고르기"></select>
    <button class="del" id="delBtn" type="button" style="height:44px">고른 품목 빼기</button>
  </section>
  <div class="tools">
    <button class="btn" id="zeroBtn" type="button">주문 수량 모두 0으로</button>
    <button class="btn" id="restoreBtn" type="button">빠진 기본 품목 다시 넣기</button>
    <button class="btn" id="resetBtn" type="button">처음 값으로 되돌리기</button>
  </div>
  </div>
  </details>



  <details class="fold">
  <summary>여사장님용: 합쳐서 업체 발주서 만들기</summary>
  <div class="inner">
  <section class="card">
    <p class="hint">각 매장에서 받은 발주품목 메시지를 그대로 붙여넣으세요. 두 매장 것을 이어서 붙여도 돼요.</p>
    <textarea id="mergeIn" placeholder="(양산 발주 11/15) 로 시작하는 메시지 붙여넣기" aria-label="매장에서 받은 발주품목 메시지"></textarea>
    <p class="err" id="mergeErr" hidden></p>
    <button class="btn primary" id="mergeBtn" type="button">발주서 만들기</button>
    <textarea id="mergeOut" readonly hidden aria-label="합친 업체 발주서"></textarea>
    <button class="btn" id="mergeCopy" type="button" hidden>발주서 복사</button>
    <p class="ok" id="mergeStatus"></p>
  </section>
  </div>
  </details>

</div>

<div class="bar"><div class="undo" id="undo" hidden><p id="undoTxt"></p><button id="undoBtn" type="button">되돌리기</button></div><div>
  <p>주문 <b id="sumN">0</b>개</p>
  <button id="saveBtn" type="button">저장하고 발주품목 복사</button>
</div></div>

<script>
var STORES={ys:"양산",jg:"정관"};
var LINE="———————————————-";
function key(store,sheet){if(!sheet||sheet==="powder")return store==="jg"?"jg-order-v3":"ys-order-v1";return store+"-"+sheet+"-v1"}
function defaultsJg(){return {etc:"",secs:[
  {t:"파우더",head:true,items:[
    {n:"고구마",o:0,r:1,m:""},{n:"사과",o:0,r:1,m:""},{n:"복숭아",o:0,r:2,m:"일반1, 제로1"},
    {n:"청귤",o:0,r:1,m:""},{n:"말차",o:0,r:1,m:""},{n:"초코",o:1,r:0,m:""},
    {n:"버터스카치",o:0,r:1,m:""},{n:"오미자",o:1,r:2,m:""},{n:"바닐라",o:0,r:1,m:""},
    {n:"우베",o:0,r:1,m:""},{n:"요거트",o:0,r:0,m:"아직 사용량 있음"}]},
  {t:"시럽+청+리플잼",head:true,items:[
    {n:"레몬퓨레",o:1,r:3,m:""},{n:"바닐라빈시럽",o:0,r:1,m:""},{n:"복숭아리플잼",o:0,r:1,m:""},
    {n:"고구마리플잼",o:0,r:0,m:"사용중 넉넉"},{n:"레몬청",o:0,r:2,m:""},{n:"자몽퓨레",o:0,r:1,m:""},
    {n:"생강청",o:1,r:0,m:"사용량 조금 남음"},{n:"유자청",o:0,r:1,m:""},{n:"레몬즙",o:0,r:2,m:""}]},
  {t:"기타",head:true,items:[
    {n:"한라봉쥬스",o:1,r:8,m:"잔여는 병 기준",u:"박스"},{n:"설탕시럽",o:1,r:0,m:"",p:60}]}
]}}
function powderDefaults(store){var d=store==="jg"?defaultsJg():{etc:"",secs:[
  {t:"파우더",head:true,items:[
    {n:"초코",o:0,r:1,m:""},{n:"고구마",o:0,r:2,m:""},{n:"말차",o:1,r:1,m:""},
    {n:"이츠바닐라",o:1,r:0,m:""},{n:"그릭아침요거트",o:2,r:1,m:""},{n:"사과",o:0,r:2,m:""},
    {n:"청귤",o:0,r:1,m:""},{n:"매실",o:1,r:0,m:""},{n:"자스민",o:0,r:0,m:"",p:40},
    {n:"우베",o:1,r:1,m:""},{n:"제로슈가 복숭아아이스티",o:1,r:0,m:"",p:30},{n:"버터스카치",o:1,r:0,m:""}]},
  {t:"시럽+청+리플잼",head:true,items:[
    {n:"복숭아 리플잼",o:1,r:0,m:""},{n:"블루베리 리플잼",o:1,r:0,m:""},{n:"자몽퓨레",o:1,r:0,m:""},
    {n:"바닐라시럽",o:1,r:0,m:""},{n:"레몬청",o:1,r:1,m:"개봉 예정"},{n:"꿀생강차 청",o:1,r:0,m:""},
    {n:"꿀유자차 청",o:0,r:1,m:""},{n:"대추&진저 베이스",o:0,r:0,m:""}]},
  {t:"박스 주문",head:false,items:[
    {n:"오미자파우더",o:0,r:1,m:"1box 주문"}]}
]};
  d.secs.forEach(function(s){s.items.forEach(function(it){
    if(it.p==null)it.p=0;
    if(store==="jg"){it.o=0;it.r=0;it.p=0;it.m=""}})});
  return d}
var SHEETS=[
  {id:"powder",name:"파우더·청 (앤오스퀘어)",short:"파우더·청"},
  {id:"yachae",name:"야채온",short:"야채온"},
  {id:"fresis",name:"프레시스",short:"프레시스"},
  {id:"coupang",name:"쿠팡",short:"쿠팡"},
  {id:"costco",name:"코스트코",short:"코스트코"},
  {id:"milk",name:"우유·치즈",short:"우유·치즈"},
  {id:"takeout",name:"테이크아웃 (컵·뚜껑)",short:"테이크아웃"},
  {id:"etc",name:"기타 (치아바타·식용유·마기소스)",short:"기타",grouped:true}];
function sheetOf(id){for(var i=0;i<SHEETS.length;i++)if(SHEETS[i].id===id)return SHEETS[i];return SHEETS[0]}
var BR={
  yachae:[{t:"야채온",items:["루꼴라","청상추",{n:"새송이버섯",u:"kg"},{n:"맛느타리버섯",u:"팩"},"양파",{n:"대추방울토마토",m:"비싸면 마트에서 직접 구매"}]}],
  fresis:[{t:"프레시스",items:["새우","베이컨","소세지","비스크육수","감자튀김","트러플오일","아몬드슬라이스","파마산치즈","모짜렐라치즈블럭","올리타리아 올리브오일 5L","케이퍼","봉골레스톡파우더","카사레치아면",{n:"앵커버터",u:"박스"},"액상버터"]}],
  coupang:[{t:"쿠팡",items:["김치볶음밥","햇반","알감자"]}],
  costco:[{t:"코스트코",items:["빠다노치즈","리조또소스","바질소스","마리나라소스","발사믹소스","글레이즈","월계수잎"]}],
  milk:[{t:"우유·치즈",items:["크림치즈","리코타치즈","부라타치즈","펠렛치즈",{n:"갈바니치즈",only:"ys"}]}],
  takeout:[{t:"컵",items:[{n:"아이스컵",u:"줄"},{n:"핫컵",u:"줄"}]},{t:"뚜껑",items:[{n:"아이스 뚜껑 (플랫형)",u:"줄"},{n:"스무디 뚜껑",u:"줄"}]}],
  etc:[{t:"치아바타",items:["먹물치아바타"]},{t:"식용유",items:["식용유 말통"]},{t:"네이버",items:["마기소스"]}]};
function defaults(store,sheet){
  if(!sheet||sheet==="powder"||!BR[sheet])return powderDefaults(store);
  return {etc:"",secs:BR[sheet].map(function(sec){return {t:sec.t,head:true,items:sec.items.filter(function(x){return !x.only||x.only===store}).map(function(x){
    return typeof x==="string"?{n:x,o:0,r:0,m:"",p:0}:{n:x.n,o:0,r:0,m:x.m||"",p:0,u:x.u||"개"}})}})};
}
function headLine(storeName,sheet,date){var sh=sheetOf(sheet);return "("+storeName+" 발주 "+date+(sh.id==="powder"?"":" · "+sh.short)+")"}
function today(d){return (d.getMonth()+1)+"/"+d.getDate()}
function nextDate(d){
  var y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  var last=new Date(y,m+1,0).getDate(),second=Math.min(30,last);
  if(day<=15)return (m+1)+"/15";
  if(day<=second)return (m+1)+"/"+second;
  return ((m+1)%12+1)+"/15";
}
function migrate(s){s.secs.forEach(function(sec){sec.items.forEach(function(it){
  if(it.p==null){var m=/^뜯긴 거 (\d+)%$/.exec((it.m||"").trim());if(m){it.p=Math.round(+m[1]/10)*10;it.m=""}else it.p=0}})});return s}
function opened(it){return it.p?"뜯긴 거 "+it.p+"%":""}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function buildMessage(st,head,who){
  var out=[head];
  if(who)out.push("발주자: "+who);
  var first=true;
  st.secs.forEach(function(sec){
    if(!sec.items.length)return;
    out.push("");if(!first)out.push(LINE);first=false;
    if(sec.head)out.push("<"+sec.t+">");
    sec.items.forEach(function(it){
      var memo=(it.m||"").trim(),op=opened(it);
      if(sec.head){var parts=[op,memo].filter(Boolean);out.push(it.n+it.o+" 잔여"+it.r+(parts.length?" ("+parts.join(", ")+")":""))}
      else{out.push(it.n+it.o+" 잔여"+it.r+(op?" ("+op+")":""));if(memo)out.push(memo.replace(/\.$/,"")+".")}
    });
  });
  out.push("",LINE,"기타사항.");
  var etc=(st.etc||"").trim();if(etc)out.push(etc);
  return out.join("\n");
}
function orderItems(st){var a=[];st.secs.forEach(function(s){s.items.forEach(function(i){if(i.o>0)a.push({n:i.n,o:i.o,u:i.u||"개"})})});return a}
function buildOrder(st,head,who,grouped){
  var out=[head],items=orderItems(st);
  if(who)out.push("발주자: "+who);
  out.push("");
  if(!items.length)out.push("주문 없음");
  if(grouped)st.secs.forEach(function(sec){
    var its=sec.items.filter(function(i){return i.o>0});if(!its.length)return;
    if(out[out.length-1]!=="")out.push("");out.push("["+sec.t+"]");
    its.forEach(function(i){out.push(i.n+" "+i.o+(i.u||"개"))})});
  else items.forEach(function(i){out.push(i.n+" "+i.o+(i.u||"개"))});
  if(items.length)out.push("","총 "+items.length+"품목");
  var etc=(st.etc||"").trim();if(etc)out.push("","기타사항: "+etc.replace(/\s*\n\s*/g," / "));
  return out.join("\n");
}
function buildVendor(groups,date){
  var out=["안녕하세요, 카페686입니다.",(date?date+" ":"")+"발주 부탁드립니다."],tot=0;
  groups.forEach(function(g){
    out.push("","["+g.store+"]");
    if(!g.items.length)out.push("주문 없음");
    g.items.forEach(function(i){out.push(i.n+" "+i.o+(i.u||"개"));tot++});
  });

}
function parseMessages(text){

    var l=raw.trim();if(!l)return;
    var h=/^\(\s*(.+?)\s*발주\s*([0-9]{1,2}\s*\/\s*[0-9]{1,2})?\s*(?:·\s*(.+?))?\s*\)/.exec(l);
    if(h){skip=false;cur={store:h[1].replace(/점$/,"")+"점"+(h[3]?" · "+h[3]:""),who:"",items:[]};groups.push(cur);if(h[2]&&!date)date=h[2].replace(/\s/g,"");return}
    var w=/^발주자\s*[:：]\s*(.+)$/.exec(l);
    if(w){if(cur)cur.who=w[1].trim();return}
    if(/^기타사항/.test(l)){skip=true;return}
    if(skip||/^총\s*\d+/.test(l)||/^주문 없음/.test(l))return;
    var m=/^(.+?)\s*(\d+)\s*\/?\s*잔여\s*(\d+)/.exec(l),unit="개";

      seen++;var o=+m[2];if(o>0)cur.items.push({n:m[1].trim(),o:o,u:unit});
    }
  });
  return {date:date,groups:groups,seen:seen};
}
