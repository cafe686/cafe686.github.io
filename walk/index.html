<style>

import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 안내 문구 (여기만 고치면 화면 내용이 바뀌어요) ================= */
const CONTENT = {
  store: '양산석산점',
  counter: { kicker:'COFFEE & BRUNCH', title:'카운터', body:'<p>주문은 이곳 카운터에서 해주세요. 스페셜티 커피와 브런치를 준비해요.</p><p>카페686 양산석산점<br>경남 양산시 동면 금오로 255 106호</p>', imgs:['logo.jpg','latte.jpg'] },
  shelf:   { kicker:'686 BLEND', title:'원두 선반', body:'<p>카운터 뒤 선반에 카페686 원두와 박스가 진열돼 있어요.</p>', imgs:['bag.jpg','box2.jpg'] },
  dessert: { kicker:'HAPPINESS IS 686 COFFEE & DESSERT', title:'디저트', body:'<ul><li>브라우니 쿠키</li><li>그린티 롤</li><li>밀크크림 롤</li><li>초코크림 롤</li></ul>', imgs:['posters2.jpg','cookie.jpg','roll.jpg'] },
  slogan:  { kicker:'CAFE 686', title:'I hope your rest is like a picture', body:'<p>당신의 쉼이 한 장의 그림 같기를.</p><p>SPECIALTY COFFEE · BREAKFAST · LUNCH</p>', imgs:['banner.jpg'] },
  goods:   { kicker:'CAFE 686', title:'686 티셔츠', body:'<p>창가 기둥에 걸린 카페686 티셔츠예요.</p>', imgs:['shirt.jpg'] },
};
const COLORS = ['#2f55d4', '#e8899c', '#4fae9a', '#f2b632', '#8a63d2'];

/* ================= 기본 설정 ================= */
const coarse = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe2f2');
scene.fog = new THREE.Fog('#dce8f1', 40, 140);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(coarse ? 70 : 62, innerWidth / innerHeight, 0.05, 260);

/* ================= 로딩 ================= */
const manager = new THREE.LoadingManager();
const barI = document.querySelector('#bar i');
manager.onProgress = (u, l, t) => { barI.style.width = Math.round(l / t * 100) + '%'; };
const loader = new THREE.TextureLoader(manager);
function photo(name){ const t = loader.load('./tex/' + name); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }

/* ================= 캔버스 질감 ================= */
function canvasTex(w, h, draw, repeat = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
function rnd(a){ let s = a; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function noise(g, w, h, n, col, a, size = 2, seed = 7){
  const r = rnd(seed); g.fillStyle = col;
  for (let i = 0; i < n; i++){ g.globalAlpha = a * r(); g.fillRect(r() * w, r() * h, size, size); }
  g.globalAlpha = 1;
}
const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#c98b54'; g.fillRect(0, 0, w, h);
  const r = rnd(3);
  for (let i = 0; i < 90; i++){
    const y = r() * h, amp = 2 + r() * 6, ph = r() * 6;
    g.strokeStyle = r() < .5 ? 'rgba(120,64,28,.22)' : 'rgba(240,190,140,.18)';
    g.lineWidth = .6 + r() * 2.2; g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, y + Math.sin(x / 70 + ph) * amp);
    g.stroke();
  }
  noise(g, w, h, 3000, '#7a4320', .12, 2, 11);
});
const pinkTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#eba893'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 16000, '#c97f68', .28, 2, 5); noise(g, w, h, 9000, '#ffd4c4', .25, 2, 9);
});
const blueTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#2142c4'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 20000, '#0d1f80', .45, 3, 2); noise(g, w, h, 9000, '#4b6cf0', .35, 2, 4);
});
const tileTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#d6c5ad'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 14000, '#a8957b', .18, 2, 6); noise(g, w, h, 8000, '#f1e5d2', .2, 2, 8);
  g.fillStyle = 'rgba(130,110,85,.55)'; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h); g.fillRect(0, h / 2, w, 3); g.fillRect(w / 2, 0, 3, h);
});
const shineTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#ece6dc'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 6000, '#cfc5b6', .25, 3, 3);
  g.fillStyle = 'rgba(160,150,135,.6)'; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h);
});
const mintTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#9fbcbb'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 32){ g.fillStyle = 'rgba(60,90,90,.35)'; g.fillRect(x, 0, 3, h); g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x + 3, 0, 2, h); }
  noise(g, w, h, 1500, '#6e8f8e', .2, 2, 5);
});
const windowsTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#e9e6df'; g.fillRect(0, 0, w, h);
  for (let y = 12; y < h; y += 36) for (let x = 14; x < w; x += 40){ g.fillStyle = (x * y) % 7 ? '#9fb3c4' : '#7d93a8'; g.fillRect(x, y, 26, 22); }
});

/* ================= 재질 ================= */
const S = (o) => new THREE.MeshStandardMaterial(o);
const M = {
  wood: S({ map:woodTex, roughness:.55, envMapIntensity:.4 }),
  woodDark: S({ map:woodTex, color:'#b88050', roughness:.5, envMapIntensity:.4 }),
  pink: S({ map:pinkTex, roughness:.95, envMapIntensity:.25 }),
  ceil: S({ map:blueTex, roughness:1, envMapIntensity:.2 }),
  blue: S({ color:'#1d3bbd', roughness:.45, envMapIntensity:.5 }),
  navy: S({ color:'#1e2a57', roughness:.6, envMapIntensity:.4 }),
  cushion: S({ color:'#2a3767', roughness:.85, envMapIntensity:.3 }),
  steel: S({ color:'#dfe2e6', metalness:.55, roughness:.3, envMapIntensity:1.1 }),
  chrome: S({ color:'#eef0f3', metalness:1, roughness:.15, envMapIntensity:1.2 }),
  black: S({ color:'#1d1e22', roughness:.45, envMapIntensity:.6 }),
  white: S({ color:'#f5f3ef', roughness:.55, envMapIntensity:.4 }),
  top: S({ color:'#f3f1ec', roughness:.4, envMapIntensity:.5 }),
  mint: S({ map:mintTex, roughness:.8, envMapIntensity:.3 }),
  mintFlat: S({ color:'#a6c3c2', roughness:.8, envMapIntensity:.3 }),
  leather: S({ color:'#a5532b', roughness:.5, envMapIntensity:.5 }),
  frame: S({ color:'#c9bfae', roughness:.6, envMapIntensity:.4 }),
  glass: new THREE.MeshPhysicalMaterial({ color:'#d6edf4', transparent:true, opacity:.13, roughness:.05, metalness:0, depthWrite:false, envMapIntensity:1.2, side:THREE.DoubleSide }),
  glow: S({ color:'#ffffff', emissive:'#fff0d8', emissiveIntensity:1.7 }),
  led: S({ color:'#ffcf8a', emissive:'#ffa64a', emissiveIntensity:3 }),
  panelLight: S({ color:'#ffffff', emissive:'#ffffff', emissiveIntensity:1.4 }),
  tray: S({ color:'#2448d8', roughness:.4 }),
  cup: S({ color:'#fbfbf8', roughness:.3, envMapIntensity:.6 }),
  pinkPot: S({ color:'#f2b7c4', roughness:.35 }),
  screen: S({ color:'#0b0c10', roughness:.15, metalness:.2, envMapIntensity:1 }),
  silver: S({ color:'#e2e2e0', metalness:.5, roughness:.35, envMapIntensity:.9 }),
  leaf: S({ color:'#4c8a3a', roughness:.9, flatShading:true }),
  leaf2: S({ color:'#6aa346', roughness:.9, flatShading:true }),
  hedge: S({ color:'#3f7a34', roughness:1, flatShading:true }),
  azalea: S({ color:'#d55bb0', roughness:.9 }),
  trunk: S({ color:'#5b4637', roughness:1 }),
  walk: S({ color:'#cdc6bb', roughness:.95 }),
  road: S({ color:'#55575c', roughness:1 }),
  grass: S({ color:'#7aa35a', roughness:1 }),
  corridorWall: S({ color:'#e2e0dc', roughness:.8 }),
  bldg: S({ map:windowsTex, roughness:.9 }),
  bag: S({ color:'#8dbde6', roughness:.75 }),
  juiceA: S({ color:'#f2a03a', roughness:.2, transparent:true, opacity:.9 }),
  juiceB: S({ color:'#d8344a', roughness:.2, transparent:true, opacity:.9 }),
  juiceC: S({ color:'#f3cf3c', roughness:.2, transparent:true, opacity:.9 }),
  shirt: S({ color:'#5e6668', roughness:.9 }),
};
const SC = new Map([[M.wood,1.2],[M.woodDark,1.2],[M.pink,2.4],[M.ceil,3],[M.mint,1]]);

const mx = x => x;
/* ================= 모양 만들기 (같은 재질끼리 합쳐서 가볍게) ================= */
const buckets = new Map();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
function put(geo, mat, x, y, z, ry = 0, rx = 0, rz = 0, sx = 1, sy = 1, sz = 1){
  _e.set(rx, ry, rz, 'YXZ'); _q.setFromEuler(_e); _p.set(x, y, z); _s.set(sx, sy, sz);
  _m.compose(_p, _q, _s); geo.applyMatrix4(_m);
  if (!buckets.has(mat)) buckets.set(mat, []);
  buckets.get(mat).push(geo);
}
const RAW = new Map();
function putRaw(geo, mat, x, y, z, ry){
  _e.set(0, ry, 0, 'YXZ'); _q.setFromEuler(_e); _p.set(mx(x), y, z); _s.set(1, 1, 1);
  _m.compose(_p, _q, _s); geo.applyMatrix4(_m);
  if (!RAW.has(mat)) RAW.set(mat, []); RAW.get(mat).push(geo);
}
function boxGeo(w, h, d, s = 1){
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++){ const i = f * 4 + v; uv.setXY(i, uv.getX(i) * dims[f][0] / s, uv.getY(i) * dims[f][1] / s); }
  return g;
}
function B(x0, y0, z0, x1, y1, z1, mat){
  const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0), d = Math.abs(z1 - z0);
  if (w < 1e-4 || h < 1e-4 || d < 1e-4) return;
  put(boxGeo(w, h, d, SC.get(mat) || 1), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
}
function C(x, y0, z, r, h, mat, seg = 14, r2 = r){ put(new THREE.CylinderGeometry(r2, r, h, seg), mat, x, y0 + h / 2, z); }
function rod(a, b, r, mat, seg = 8){
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b), d = vb.clone().sub(va), len = d.length();
  const g = new THREE.CylinderGeometry(r, r, len, seg);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  const mid = va.add(vb).multiplyScalar(.5);
  _m.compose(mid, q, new THREE.Vector3(1, 1, 1)); g.applyMatrix4(_m);
  if (!buckets.has(mat)) buckets.set(mat, []); buckets.get(mat).push(g);
}
function sphere(x, y, z, r, mat, sy = 1, seg = 20){ put(new THREE.SphereGeometry(r, seg, Math.round(seg * .7)), mat, x, y, z, 0, 0, 0, 1, sy, 1); }
const single = []; // 사진 붙이는 판(개별 재질)
function picture(tex, w, h, x, y, z, ry, opts = {}){
  const mat = S({ map:tex, roughness:opts.rough ?? .6, transparent:!!opts.transparent, side:opts.double ? THREE.DoubleSide : THREE.FrontSide, envMapIntensity:.3 });
  if (opts.glow){ mat.emissiveMap = tex; mat.emissive = new THREE.Color(opts.glow); mat.emissiveIntensity = opts.glowI ?? .5; }
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  mesh.position.set(mx(x), y, z); mesh.rotation.y = ry; mesh.receiveShadow = !opts.noShadow;
  scene.add(mesh); single.push(mesh); return mesh;
}
function textTex(lines, o){
  return canvasTex(o.w, o.h, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.fillStyle = o.color; g.textAlign = o.align || 'center'; g.textBaseline = 'middle';
    lines.forEach((t, i) => { g.font = o.font; g.fillText(t, o.align === 'left' ? 10 : w / 2, (i + .5) * h / lines.length); });
  }, false);
}

function windowGrid(axis, fixed, a0, a1, y0, y1, nA, nY, mat, t = .06){

  const pane = (p0, p1, q0, q1) => axis === 'x' ? B(p0, q0, fixed - .01, p1, q1, fixed + .01, M.glass) : B(fixed - .01, q0, p0, fixed + .01, q1, p1, M.glass);
  const bar = (p0, p1, q0, q1) => axis === 'x' ? B(p0, q0, fixed - t / 2, p1, q1, fixed + t / 2, mat) : B(fixed - t / 2, q0, p0, fixed + t / 2, q1, p1, mat);
  pane(a0, a1, y0, y1);
  for (let i = 0; i <= nA; i++){ const a = a0 + (a1 - a0) * i / nA; bar(a - t / 2, a + t / 2, y0, y1); }
  for (let j = 0; j <= nY; j++){ const y = y0 + (y1 - y0) * j / nY; bar(a0, a1, y - t / 2, y + t / 2); }
}

  if (len > .05){
    const target = Math.atan2(-(fx * f + rx * s), -(fz * f + rz * s));
    let d = target - P.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); P.yaw += d * Math.min(1, dt * 12);
    if (P.mode === 'first') P.yaw = P.camYaw;
  }
  P.speed = len > .05 && moved > 0 ? sp * len : 0;
  const tf = floorAt(P.x, P.z);
  P.feet += (tf - P.feet) * Math.min(1, dt * 14); if (Math.abs(tf - P.feet) < .002) P.feet = tf;
}
const ray = new THREE.Raycaster(), _t = new THREE.Vector3(), _d = new THREE.Vector3();
let camDist = coarse ? 3.3 : 3.0;
function applyCam(){
  const sx = P.sit ? P.sit.x : P.x, sz = P.sit ? P.sit.z : P.z, sy = P.sit ? P.sit.y : P.feet;
  if (me){
    me.root.visible = P.mode === 'third';
    me.sit = !!P.sit;
    me.root.position.set(sx, sy + (P.sit ? (P.sit.stool ? .0 : .02) : 0), sz);
    me.root.rotation.y = P.sit ? P.sit.yaw : P.yaw;
  }
  if (P.mode === 'first'){
    camera.position.set(sx, sy + (P.sit ? 1.15 : 1.45), sz);
    camera.rotation.set(P.camPitch, P.camYaw, 0, 'YXZ'); return;
  }
  _t.set(sx, sy + (P.sit ? 1.0 : 1.25), sz);
  const cp = Math.cos(P.camPitch);
  _d.set(-Math.sin(P.camYaw) * cp, Math.sin(P.camPitch), -Math.cos(P.camYaw) * cp).normalize();
  let d = camDist;
  ray.set(_t, _d.clone().negate()); ray.far = d + .3;
  const hit = ray.intersectObjects(OCC, false)[0];
  if (hit) d = Math.max(.35, hit.distance - .25);
  camera.position.copy(_t).addScaledVector(_d, -d);
  camera.lookAt(_t);
}

/* 입력 */
const actBtn = document.getElementById('act');
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyE' && !actBtn.hidden) actBtn.click(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const cv = renderer.domElement, joyEl = document.getElementById('joy'), knob = joyEl.firstElementChild;
let joyId = null, joyO = null; const looks = new Map();
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  if (e.pointerType !== 'mouse' && e.clientX < innerWidth * .45 && joyId === null && !P.sit){
    joyId = e.pointerId; joyO = { x:e.clientX, y:e.clientY };
    joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.hidden = false; knob.style.transform = '';
  } else looks.set(e.pointerId, { x:e.clientX, y:e.clientY });
  hideHint();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId === joyId){
    let dx = e.clientX - joyO.x, dy = e.clientY - joyO.y; const d = Math.hypot(dx, dy), m = 55;
    if (d > m){ dx *= m / d; dy *= m / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`; joyV = { x:dx / m, y:dy / m };
  } else if (looks.has(e.pointerId)){
    const l = looks.get(e.pointerId), k = e.pointerType === 'mouse' ? .0045 : .006;
    P.camYaw -= (e.clientX - l.x) * k;
    const lo = P.mode === 'first' ? -1.2 : -1.15, hi = P.mode === 'first' ? 1.0 : .3;
    P.camPitch = Math.max(lo, Math.min(hi, P.camPitch - (e.clientY - l.y) * k));
    l.x = e.clientX; l.y = e.clientY;
  }
});
const endPtr = e => { if (e.pointerId === joyId){ joyId = null; joyV = { x:0, y:0 }; joyEl.hidden = true; } looks.delete(e.pointerId); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { camDist = Math.max(1.6, Math.min(6, camDist + e.deltaY * .003)); e.preventDefault(); }, { passive:false });

/* ================= 화면 UI ================= */
const where = document.getElementById('where'), sheetWrap = document.getElementById('sheetWrap'), hint = document.getElementById('hint'), viewBtn = document.getElementById('viewBtn');
let near = null, whereTxt = '';
function openSheet(id){
  const c = CONTENT[id]; if (!c) return;
  document.getElementById('sheetKicker').textContent = c.kicker;
  document.getElementById('sheetTitle').textContent = c.title;
  document.getElementById('sheetBody').innerHTML = (c.imgs ? '<div class="imgs">' + c.imgs.map(i => `<img src="./tex/${i}" alt="">`).join('') + '</div>' : '') + c.body;
  sheetWrap.hidden = false; document.getElementById('sheetClose').focus();
}
document.getElementById('sheetClose').onclick = () => { sheetWrap.hidden = true; };
sheetWrap.addEventListener('click', e => { if (e.target === sheetWrap) sheetWrap.hidden = true; });
let sitSpot = null;
actBtn.onclick = () => {
  if (P.sit){ P.x = sitSpot.x; P.z = sitSpot.z; P.feet = sitSpot.lvl ? F15 : 0; P.yaw = P.sit.yaw; P.sit = null; sitSpot = null; near = null; actBtn.hidden = true; return; }
  if (!near) return;
  if (near.sit){ P.sit = near.sit; sitSpot = near; P.camYaw = near.sit.yaw; P.camPitch = P.mode === 'first' ? -.1 : -.25; actBtn.textContent = '일어나기'; showHint('자리에 앉았어요. 화면을 끌어서 둘러보세요.'); }
  else openSheet(near.id);
};
viewBtn.onclick = () => { P.mode = P.mode === 'third' ? 'first' : 'third'; viewBtn.textContent = P.mode === 'third' ? '1인칭' : '3인칭'; P.camPitch = P.mode === 'first' ? 0 : -.3; if (P.mode === 'first' && !P.sit) P.camYaw = P.yaw; };
document.getElementById('resetBtn').onclick = () => { Object.assign(P, { x:START.x, z:START.z, feet:0, yaw:START.yaw, camYaw:START.yaw, camPitch:P.mode === 'first' ? 0 : -.3, sit:null }); sitSpot = null; near = null; actBtn.hidden = true; };
let hintT;
function showHint(t, ms = 4500){ hint.textContent = t; hint.hidden = false; hint.style.opacity = 1; clearTimeout(hintT); hintT = setTimeout(hideHint, ms); }
function hideHint(){ hint.style.opacity = 0; clearTimeout(hintT); hintT = setTimeout(() => hint.hidden = true, 600); }
function updateUI(t){
  const lvl = P.feet > .7 ? 1 : 0;
  for (const s of SPOTS){ const k = 1 + Math.sin(t * 3 + s.x) * .12; s.ring.scale.set(k, k, k); s.ring.visible = !P.sit; }
  ringMat.opacity = .55 + Math.sin(t * 3) * .25;
  const w = P.z < 0 && !P.sit ? '입구 로비' : ((P.sit ? P.sit.y : P.feet) > .7 ? '1.5층' : '1층');
  if (w !== whereTxt){ whereTxt = w; where.innerHTML = `<b>Cafe 686</b>${CONTENT.store} · ${w}`; }
  if (P.sit) return;
  let best = null, bd = 1e9;
  for (const s of SPOTS){ if (s.lvl !== lvl) continue; const d = Math.hypot(P.x - s.x, P.z - s.z); if (d < s.r && d < bd){ bd = d; best = s; } }
  if (best !== near){ near = best; actBtn.hidden = !best; if (best) actBtn.textContent = best.label; }
}
function npcStep(dt, t){
  for (const n of NPC){
    let sp = 0;
    if (n.walk){
      const w = n.walk;
      if (w.wait > 0){ w.wait -= dt; n.c.root.rotation.y = 0; }
      else { const tx = w.dir > 0 ? w.b : w.a, dx = tx - n.c.root.position.x;
        if (Math.abs(dx) < .05){ w.dir *= -1; w.wait = 2 + Math.random() * 3; }
        else { n.c.root.position.x += Math.sign(dx) * Math.min(Math.abs(dx), .9 * dt); n.c.root.rotation.y = dx > 0 ? -Math.PI / 2 : Math.PI / 2; sp = .9; } }
    }
    n.c.pose(dt, sp, t);
  }
}

/* ================= 시작 ================= */
const startEl = document.getElementById('start'), startBtn = document.getElementById('startBtn'), picks = document.getElementById('picks');
let myColor = COLORS[0];
COLORS.forEach((c, i) => { const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', '캐릭터 색 ' + (i + 1)); b.setAttribute('aria-pressed', i === 0); b.onclick = () => { myColor = c; picks.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); }; picks.appendChild(b); });
document.getElementById('how').innerHTML = coarse
  ? '왼쪽 화면을 누른 채 밀면 걸어요<br>오른쪽 화면을 끌면 둘러봐요'
  : 'W A S D 또는 방향키로 걸어요 · Shift 빨리 걷기<br>마우스로 끌면 둘러보고, 휠로 가까이·멀리';
manager.onLoad = () => { startBtn.disabled = false; startBtn.textContent = '들어가기'; barI.style.width = '100%'; };
setTimeout(() => { if (startBtn.disabled){ startBtn.disabled = false; startBtn.textContent = '들어가기'; } }, 8000);
startBtn.onclick = () => {
  me = makeChar(myColor, 0);
  startEl.hidden = true;
  showHint(coarse ? '왼쪽을 밀어 걷고, 오른쪽을 끌어 둘러보세요. 파란 동그라미에 가면 버튼이 나와요.' : '방향키로 걷고 마우스로 둘러보세요. 파란 동그라미에 가면 버튼이 나와요.', 7000);
};
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (startEl.hidden && sheetWrap.hidden) step(dt);
  npcStep(dt, t);
  if (me) me.pose(dt, P.speed, t);
  applyCam(); updateUI(t);
  renderer.render(scene, camera);
});
window.__walk = { P, COL, floorAt, scene, renderer, shot(){ applyCam(); updateUI(clock.elapsedTime); renderer.render(scene, camera); }, start(){ startBtn.click(); } };
</script>
